name: clearcsv

x-api: &api
  image: ${API_IMAGE:-clearcsv-api}:${VERSION:-1.0.0}
  build:
    context: .
    dockerfile: api/Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-1.0.0}
  environment: &api-environment
    PGHOST: db
    PGPORT: 5432
    PGDATABASE: ${PGDATABASE:-clearcsv}
    PGUSER: ${PGUSER:-clearcsv}
    PGPASSWORD_FILE: /run/secrets/db_password
    APP_VERSION: ${APP_VERSION:-1.0.0}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8080}
    HOST: 0.0.0.0
    PORT: 3000
  secrets:
    - db_password
  networks:
    - data
    - app
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-clearcsv}
      POSTGRES_USER: ${PGUSER:-clearcsv}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    command: [node, dist-api/migrate.js, up]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:-clearcsv-frontend}:${VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      API_UPSTREAM: ${API_UPSTREAM:-api:3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  app:
  data:
    internal: true
volumes:
  postgres_data:
secrets:
  db_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
