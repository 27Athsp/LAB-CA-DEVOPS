services:
  database:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the database user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "${DB_PRIVATE_IP:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?Create and name the persistent database volume explicitly}
networks:
  database:
    driver: bridge
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set an absolute path to the protected password file}
